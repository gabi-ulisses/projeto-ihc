</head>
<body>
    <header>
        <nav>
            <ul>
                <li class="liPrincipal"><a href="../index.html" title="Página inicial">INÍCIO</a></li>
                <li class="liPrincipal"><a href="introducao.html" title="Introdução">INTRODUÇÃO</a></li>
                <li class="liPrincipal"><a href="dicas.html" title="Dicas">DICAS</a></li>
                <li class="liPrincipal"><a href="passos.html" title="Passo a passo"><img width="22px" src="../assets/img/icones/quebra-cabeca.png" alt=""></a></li>
                <li id="icones">
                    <ul>
                        <li id="li_icon1" style="background-color: #e9e9e9; box-shadow:1px 1px 1px #050505a4"><a class="icon" href="suporte.html"><img src="../assets/img/icones/suporte.png" alt="Ícone de suporte" title="Suporte"></a></li>
                        <li id="li_icon2"><a class="icon" href="sobre.html"><img src="../assets/img/icones/sobre2.png" alt="Ícone de pessoas" title="Sobre nós"></a></li>
                    </ul>
                </li>
            </ul>
        </nav>
    </header>
    <article id="acessibilidade">
        <a href="#" title="Modo Escuro"><img src="../assets/img/icones/modo-noturno.png" alt="Ícone modo escuro"></a>
        <a href="#" title="Voz"><img src="../assets/img/icones/comando-de-voz.png" alt="Ícone voz"></a>
    </article>
    <main>
        <section id="text-section">
            <article>
                <p class="titulo">“</p>
                <h1 tabindex="0">Estamos aqui para ajudar!</h1>
                <p class="description" tabindex="0">
                    Por favor, preencha o formulário ao lado com o máximo de detalhes possível para que possamos resolver seu problema rapidamente.
                    Nossa equipe de suporte entrará em contato com você o mais breve possível.
                </p>
            </article>
        </section>
        <section id="form-section">
            <article>
                <fieldset>
                <legend class="profile-image"><img src="../assets/img/icones/suporte.png" alt="Suporte"></legend>
                    <form>
                        <label for="name">Nome:</label>
                        <input type="text" id="name" name="name" placeholder="Informe seu nome completo..." required>
                        
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" placeholder="Informe seu e-mail..." required>
                        
                        <label for="message">Mensagem:</label>
                        <textarea id="message" name="message" placeholder="Descreva sua solicitação de suporte detalhadamente..." required></textarea>
                        
                        <button type="submit">Enviar</button>
                    </form>
                </fieldset>
                
            </article>
        </section>
    </main>
</body>
</html>
